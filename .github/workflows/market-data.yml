name: Market data pipeline

on:
  push:
    branches: ["infra/**"]
    paths:
      - "tools/binance_market_data/**"
      - "tests/test_binance_market_data.py"
      - "configs/binance-spot-btcusdt.json"
      - "schemas/binance-spot-kline-v1.json"
      - "schemas/market-data-manifest-v1.json"
      - "requirements-market-data.txt"
      - ".github/workflows/market-data.yml"
  pull_request:
    paths:
      - "tools/binance_market_data/**"
      - "tests/test_binance_market_data.py"
      - "configs/binance-spot-btcusdt.json"
      - "schemas/binance-spot-kline-v1.json"
      - "schemas/market-data-manifest-v1.json"
      - "requirements-market-data.txt"
      - ".github/workflows/market-data.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install market-data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt
      - name: Run market-data unit tests
        run: python -m unittest -v tests.test_binance_market_data
