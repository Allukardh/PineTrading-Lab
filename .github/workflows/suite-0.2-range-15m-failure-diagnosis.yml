name: Suite 0.2 15m RANGE_ROTATION failure diagnosis

on:
  workflow_dispatch:
  push:
    branches: ["research/suite-0.2-opportunity-evidence"]
    paths:
      - ".github/workflows/suite-0.2-range-15m-failure-diagnosis.yml"
      - "tools/suite_0_2_range_rotation_15m_failure_diagnosis.py"
      - "tools/range_rotation_reference.py"
      - "tools/range_rotation_opportunity_reference.py"
      - "tools/range_rotation_readiness_reference.py"
      - "tools/execution_historical_evidence.py"
      - "tools/execution_integrated_evidence.py"
      - "tools/market_map_offline_core.py"
      - "tools/momentum_turn_reference.py"
      - "tools/rsi_state_reference.py"
      - "tools/participation_reference.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: BTCUSDT
            slug: btc
            manifest: manifests/binance-spot-btcusdt.production-2026-09-24.json
            id15m: 10811401520
            sha15m: cac347638b577b2bcfcd671f66a68af96edb49c614c4dc203d7dc8ea3fb48411
            id1h: 10810563678
            sha1h: 86f2f12b66979d2e0659b44b95b584ec5140050770acce58e6c4643c9b409776
            id1d: 10810907465
            sha1d: 1788d075ad21091e279cb68ccfac79935149ca9c444a74dbc971bba00e15fdae
            id1w: 10811406601
            sha1w: 960de3600ea7ab8651ec2dbaa51d204e05fce19127eb53bb24fcd59dd010ac46

          - symbol: ETHUSDT
            slug: eth
            manifest: manifests/binance-spot-ethusdt.production-2026-09-24.json
            id15m: 10813507305
            sha15m: a21720575b3f20d3b083dd1fc61eaf311bd1cd38f32fd03c73f8989093a41573
            id1h: 10813991218
            sha1h: b2295b1de4448333253fc0741c26ca3faf2b8a6802df57ce11c3d30012dc1a63
            id1d: 10813576769
            sha1d: 6d6eca8ac9be5ea451bb848a78a0dbd33f0eb755fdab448ef8862b9e45ba3871
            id1w: 10813522300
            sha1w: 885484db14e9c9355cf35fba150dfbbbcd783b811854b32ce80e012b07fe9b66

          - symbol: AVAXUSDT
            slug: avax
            manifest: manifests/binance-spot-avaxusdt.production-2026-09-24.json
            id15m: 10814265025
            sha15m: df24569f0d3d8ecd887e0fc3745a6f0942d78055c2617574a562e3a4baf9b17b
            id1h: 10814265030
            sha1h: 4d9b0fd87623452810d148a1a047dacd862d83fcbec2c3675e7892f3b575b459
            id1d: 10813144664
            sha1d: 39945d0806fdf89182121f1ab9cf2cf1b05171d032887c575e094dca302ff5d4
            id1w: 10813776971
            sha1w: 24b7f47ad6681edb39eb33d9ba06f7c9d230680f254657bad3640f3d10d21582

    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_ROOT: /tmp/Binance
      OUT_DIR: /tmp/suite-0.2-range-15m-diag
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Acquire canonical 15m 1h 1d 1w snapshot
        shell: bash
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          DEST="$DATA_ROOT/spot/$SYMBOL/consolidated"
          mkdir -p "$DEST" "$OUT_DIR"
          fetch_artifact() {
            local id="$1"; local name="$2"; local expected="$3"
            gh api -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$DEST/$name"
            echo "$expected  $DEST/$name" | sha256sum -c -
          }
          fetch_artifact ${{ matrix.id15m }} "$SYMBOL"_15m.parquet ${{ matrix.sha15m }}
          fetch_artifact ${{ matrix.id1h }} "$SYMBOL"_1h.parquet ${{ matrix.sha1h }}
          fetch_artifact ${{ matrix.id1d }} "$SYMBOL"_1d.parquet ${{ matrix.sha1d }}
          fetch_artifact ${{ matrix.id1w }} "$SYMBOL"_1w.parquet ${{ matrix.sha1w }}

      - name: Run 15m failure diagnosis
        run: |
          python -m tools.suite_0_2_range_rotation_15m_failure_diagnosis             --data-root "$DATA_ROOT"             --symbol "${{ matrix.symbol }}"             --canonical-manifest "${{ matrix.manifest }}"             --output-json "$OUT_DIR/suite-0.2-${{ matrix.slug }}-range-15m-diagnosis.json"             --output-md "$OUT_DIR/suite-0.2-${{ matrix.slug }}-range-15m-diagnosis.md"             --code-sha "$GITHUB_SHA"

      - name: Show summary
        run: cat "$OUT_DIR/suite-0.2-${{ matrix.slug }}-range-15m-diagnosis.md"

      - uses: actions/upload-artifact@v7
        with:
          name: suite-0.2-${{ matrix.slug }}-range-15m-diagnosis
          path: |
            /tmp/suite-0.2-range-15m-diag/suite-0.2-${{ matrix.slug }}-range-15m-diagnosis.json
            /tmp/suite-0.2-range-15m-diag/suite-0.2-${{ matrix.slug }}-range-15m-diagnosis.md
          retention-days: 30
