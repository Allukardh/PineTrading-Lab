name: Market Map offline evidence

on:
  push:
    branches: ["feat/market-map-0.1.0-mm0"]
    paths:
      - "tools/market_map_offline*.py"
      - "tools/analyze_market_map_export.py"
      - ".github/workflows/market-map-offline-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  btc-mm0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_DIR: /tmp/btc-production
      OUT_DIR: /tmp/mm0-evidence
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Parquet dependency
        run: python -m pip install --disable-pip-version-check "pyarrow>=16.1"

      - name: Download exact BTC production artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR" "$OUT_DIR"

          fetch_artifact() {
            local id="$1"
            local name="$2"
            local expected="$3"
            gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"               > "$DATA_DIR/$name"
            echo "$expected  $DATA_DIR/$name" | sha256sum -c -
          }

          # Exact archive:false artifacts from production run 36006762328.
          fetch_artifact 10811401520 BTCUSDT_15m.parquet cac347638b577b2bcfcd671f66a68af96edb49c614c4dc203d7dc8ea3fb48411
          fetch_artifact 10810563678 BTCUSDT_1h.parquet 86f2f12b66979d2e0659b44b95b584ec5140050770acce58e6c4643c9b409776
          fetch_artifact 10811281699 BTCUSDT_4h.parquet 93226923a88861cc56d11d82900801db7f64fbe89920c710843dc26673265e06
          fetch_artifact 10810907465 BTCUSDT_1d.parquet 1788d075ad21091e279cb68ccfac79935149ca9c444a74dbc971bba00e15fdae
          fetch_artifact 10811406601 BTCUSDT_1w.parquet 960de3600ea7ab8651ec2dbaa51d204e05fce19127eb53bb24fcd59dd010ac46

      - name: Generate MM-0 Audit Schema v2
        run: |
          python tools/market_map_offline.py             --data-root "$DATA_DIR"             --output-dir "$OUT_DIR"             --json "$OUT_DIR/mm0-materialization.json"

      - name: Analyze BTC historical matrix
        run: |
          python tools/analyze_market_map_export.py             --json "$OUT_DIR/mm0-evidence.json"             "$OUT_DIR/BTCUSDT_15m_mm0_audit.csv"             "$OUT_DIR/BTCUSDT_1h_mm0_audit.csv"             "$OUT_DIR/BTCUSDT_4h_mm0_audit.csv"             "$OUT_DIR/BTCUSDT_1d_mm0_audit.csv"

      - name: Enforce structural pathology gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["OUT_DIR"]) / "mm0-evidence.json").read_text(encoding="utf-8"))
          aggregate = report["aggregate"]
          print("hard_pass:", aggregate["hard_pass"])
          print("pathologies:", aggregate["pathologies"])
          print("review_flags:", aggregate["review_flags"])
          if not aggregate["hard_pass"]:
              raise SystemExit("MM-0 offline evidence contains structural pathologies")
          PY

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v7
        with:
          name: mm0-offline-evidence.json
          path: /tmp/mm0-evidence/mm0-evidence.json
          archive: false
          retention-days: 30

      - name: Upload provenance summary
        uses: actions/upload-artifact@v7
        with:
          name: mm0-offline-materialization.json
          path: /tmp/mm0-evidence/mm0-materialization.json
          archive: false
          retention-days: 30
