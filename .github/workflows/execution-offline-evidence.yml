name: Execution offline evidence

# Evidence rerun marker: branch reconciliation 2026-09-24.
# This comment intentionally carries no semantic/default change; touching this
# workflow is the safe push trigger when workflow_dispatch is unavailable here.

on:
  workflow_dispatch:
  push:
    branches: ["research/execution-engine-design"]
    paths:
      - ".github/workflows/execution-offline-evidence.yml"
      - "tools/execution_historical_evidence.py"
      - "tools/momentum_turn_reference.py"
      - "tools/rsi_state_reference.py"
      - "tools/participation_reference.py"
      - "manifests/execution-research-defaults-v1.json"
      - "manifests/suite-semantics-v1.json"

permissions:
  contents: read
  actions: read

jobs:
  btc-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install market-data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Acquire canonical BTC snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          DEST="$RUNNER_TEMP/Binance/spot/BTCUSDT/consolidated"
          mkdir -p "$DEST"
          OK=1
          for ARTIFACT in \
            BTCUSDT_15m.parquet \
            BTCUSDT_1h.parquet \
            BTCUSDT_4h.parquet \
            BTCUSDT_1d.parquet \
            BTCUSDT_3d.parquet \
            BTCUSDT_1w.parquet
          do
            if ! gh run download 36006762328 --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$DEST"; then
              OK=0
              break
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "Canonical run artifacts unavailable; falling back to official rematerialization."
            rm -rf "$RUNNER_TEMP/Binance"
            python -m tools.binance_market_data run \
              --config configs/binance-spot-btcusdt.json \
              --symbol BTCUSDT \
              --data-root "$RUNNER_TEMP/Binance"
          else
            echo "Using exact canonical run #36006762328 Parquet artifacts."
          fi

      - name: Run pre-registered Execution evidence plan
        run: |
          python -m tools.execution_historical_evidence \
            --data-root "$RUNNER_TEMP/Binance" \
            --symbol BTCUSDT \
            --canonical-manifest manifests/binance-spot-btcusdt.production-2026-09-24.json \
            --output-json "$RUNNER_TEMP/execution-btc-evidence.json" \
            --output-md "$RUNNER_TEMP/execution-btc-evidence.md" \
            --code-sha "$GITHUB_SHA"

      - name: Show evidence summary
        run: cat "$RUNNER_TEMP/execution-btc-evidence.md"

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v7
        with:
          name: execution-btc-evidence
          path: |
            ${{ runner.temp }}/execution-btc-evidence.json
            ${{ runner.temp }}/execution-btc-evidence.md
          retention-days: 7
