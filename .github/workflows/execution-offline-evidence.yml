name: Execution offline evidence

# Evidence runner for the pre-registered Execution research plan.
# Candidate defaults are never tuned inside this workflow.

on:
  workflow_dispatch:
  push:
    branches: ["research/execution-engine-design"]
    paths:
      - ".github/workflows/execution-offline-evidence.yml"
      - "tools/execution_historical_evidence.py"
      - "tools/momentum_turn_reference.py"
      - "tools/rsi_state_reference.py"
      - "tools/participation_reference.py"
      - "manifests/execution-research-defaults-v1.json"
      - "manifests/suite-semantics-v1.json"
      - "manifests/binance-spot-btcusdt.production-2026-09-24.json"
      - "manifests/binance-spot-ethusdt.production-2026-09-24.json"
      - "manifests/binance-spot-avaxusdt.production-2026-09-24.json"

permissions:
  contents: read
  actions: read

jobs:
  btc-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install market-data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Acquire canonical BTC snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/Binance/spot/BTCUSDT/consolidated"
          mkdir -p "$DEST"

          fetch_artifact() {
            local id="$1"
            local name="$2"
            local expected="$3"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              > "$DEST/$name"
            echo "$expected  $DEST/$name" | sha256sum -c -
          }

          fetch_artifact 10811401520 BTCUSDT_15m.parquet cac347638b577b2bcfcd671f66a68af96edb49c614c4dc203d7dc8ea3fb48411
          fetch_artifact 10810563678 BTCUSDT_1h.parquet 86f2f12b66979d2e0659b44b95b584ec5140050770acce58e6c4643c9b409776
          fetch_artifact 10811281699 BTCUSDT_4h.parquet 93226923a88861cc56d11d82900801db7f64fbe89920c710843dc26673265e06
          fetch_artifact 10810907465 BTCUSDT_1d.parquet 1788d075ad21091e279cb68ccfac79935149ca9c444a74dbc971bba00e15fdae
          fetch_artifact 10811056999 BTCUSDT_3d.parquet e4228da434e9131ae2353147181069d119bc0ef373ec4b93effc5c1dcf9a39d9
          fetch_artifact 10811406601 BTCUSDT_1w.parquet 960de3600ea7ab8651ec2dbaa51d204e05fce19127eb53bb24fcd59dd010ac46

      - name: Run pre-registered BTC evidence plan
        run: |
          python -m tools.execution_historical_evidence \
            --data-root "$RUNNER_TEMP/Binance" \
            --symbol BTCUSDT \
            --canonical-manifest manifests/binance-spot-btcusdt.production-2026-09-24.json \
            --output-json "$RUNNER_TEMP/execution-btc-evidence.json" \
            --output-md "$RUNNER_TEMP/execution-btc-evidence.md" \
            --code-sha "$GITHUB_SHA"

      - name: Upload BTC evidence
        uses: actions/upload-artifact@v7
        with:
          name: execution-btc-evidence
          path: |
            ${{ runner.temp }}/execution-btc-evidence.json
            ${{ runner.temp }}/execution-btc-evidence.md
          retention-days: 30

  cross-asset-robustness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: ETHUSDT
            slug: eth
            manifest: manifests/binance-spot-ethusdt.production-2026-09-24.json
            id15m: 10813507305
            sha15m: a21720575b3f20d3b083dd1fc61eaf311bd1cd38f32fd03c73f8989093a41573
            id1h: 10813991218
            sha1h: b2295b1de4448333253fc0741c26ca3faf2b8a6802df57ce11c3d30012dc1a63
            id4h: 10813219375
            sha4h: b540dce0575ebd3e44560cb14d6ca5c3e01643d1f3f9d0e28b20b542e476c853
            id1d: 10813576769
            sha1d: 6d6eca8ac9be5ea451bb848a78a0dbd33f0eb755fdab448ef8862b9e45ba3871
            id3d: 10813671832
            sha3d: 53c147c7e909f3ac611db9d0a67570551b10a6ae1141df52134292cacc6d0833
            id1w: 10813522300
            sha1w: 885484db14e9c9355cf35fba150dfbbbcd783b811854b32ce80e012b07fe9b66
          - symbol: AVAXUSDT
            slug: avax
            manifest: manifests/binance-spot-avaxusdt.production-2026-09-24.json
            id15m: 10814265025
            sha15m: df24569f0d3d8ecd887e0fc3745a6f0942d78055c2617574a562e3a4baf9b17b
            id1h: 10814265030
            sha1h: 4d9b0fd87623452810d148a1a047dacd862d83fcbec2c3675e7892f3b575b459
            id4h: 10812979850
            sha4h: 89bdb9efae51718166587c7c819bce23635e31aa4db96a37d2a8a42617ced360
            id1d: 10813144664
            sha1d: 39945d0806fdf89182121f1ab9cf2cf1b05171d032887c575e094dca302ff5d4
            id3d: 10813626557
            sha3d: e520d146ee995ce42cf464495b16ebdc689f38cbfac7646771755a7d7eb149e3
            id1w: 10813776971
            sha1w: 24b7f47ad6681edb39eb33d9ba06f7c9d230680f254657bad3640f3d10d21582

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install market-data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Acquire exact canonical snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ matrix.symbol }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/Binance/spot/$SYMBOL/consolidated"
          mkdir -p "$DEST"

          fetch_artifact() {
            local id="$1"
            local name="$2"
            local expected="$3"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              > "$DEST/$name"
            echo "$expected  $DEST/$name" | sha256sum -c -
          }

          fetch_artifact ${{ matrix.id15m }} "$SYMBOL"_15m.parquet ${{ matrix.sha15m }}
          fetch_artifact ${{ matrix.id1h }}  "$SYMBOL"_1h.parquet  ${{ matrix.sha1h }}
          fetch_artifact ${{ matrix.id4h }}  "$SYMBOL"_4h.parquet  ${{ matrix.sha4h }}
          fetch_artifact ${{ matrix.id1d }}  "$SYMBOL"_1d.parquet  ${{ matrix.sha1d }}
          fetch_artifact ${{ matrix.id3d }}  "$SYMBOL"_3d.parquet  ${{ matrix.sha3d }}
          fetch_artifact ${{ matrix.id1w }}  "$SYMBOL"_1w.parquet  ${{ matrix.sha1w }}

      - name: Run unchanged-default robustness evidence
        run: |
          python -m tools.execution_historical_evidence \
            --data-root "$RUNNER_TEMP/Binance" \
            --symbol "${{ matrix.symbol }}" \
            --canonical-manifest "${{ matrix.manifest }}" \
            --output-json "$RUNNER_TEMP/execution-${{ matrix.slug }}-evidence.json" \
            --output-md "$RUNNER_TEMP/execution-${{ matrix.slug }}-evidence.md" \
            --code-sha "$GITHUB_SHA"

      - name: Upload robustness evidence
        uses: actions/upload-artifact@v7
        with:
          name: execution-${{ matrix.slug }}-evidence
          path: |
            ${{ runner.temp }}/execution-${{ matrix.slug }}-evidence.json
            ${{ runner.temp }}/execution-${{ matrix.slug }}-evidence.md
          retention-days: 30
