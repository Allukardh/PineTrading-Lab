name: Suite 0.2 Phase F1 ETH AVAX robustness

on:
  workflow_dispatch:
  push:
    branches: ["research/suite-0.2-opportunity-evidence"]
    paths:
      - ".github/workflows/suite-0.2-phase-f1-robustness.yml"
      - "tools/suite_0_2_phase_f1_integrated_evidence.py"
      - "tools/responsiveness_profile_reference.py"
      - "tools/test_responsiveness_profile_reference.py"
      - "tools/operator_readiness_reference.py"
      - "tools/test_operator_readiness_reference.py"
      - "tools/suite_0_2_thesis_management_evidence.py"
      - "tools/suite_0_2_thesis_management_v1_1_evidence.py"
      - "tools/thesis_management_anchor_reference.py"
      - "tools/opportunity_execution_counterfactual.py"
      - "tools/opportunity_readiness_reference.py"
      - "tools/range_rotation_opportunity_reference.py"
      - "tools/range_rotation_readiness_reference.py"
      - "tools/range_rotation_reference.py"
      - "tools/execution_candidate_reference.py"
      - "tools/execution_state_reference.py"
      - "tools/execution_integrated_evidence.py"
      - "tools/execution_historical_evidence.py"
      - "tools/market_map_offline_core.py"
      - "tools/momentum_turn_reference.py"
      - "tools/rsi_state_reference.py"
      - "tools/participation_reference.py"

permissions:
  contents: read
  actions: read

jobs:
  f1-robustness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: ETHUSDT
            slug: eth
            manifest: manifests/binance-spot-ethusdt.production-2026-09-24.json
            id15m: 10813507305
            sha15m: a21720575b3f20d3b083dd1fc61eaf311bd1cd38f32fd03c73f8989093a41573
            id1h: 10813991218
            sha1h: b2295b1de4448333253fc0741c26ca3faf2b8a6802df57ce11c3d30012dc1a63
            id4h: 10813219375
            sha4h: b540dce0575ebd3e44560cb14d6ca5c3e01643d1f3f9d0e28b20b542e476c853
            id1d: 10813576769
            sha1d: 6d6eca8ac9be5ea451bb848a78a0dbd33f0eb755fdab448ef8862b9e45ba3871
            id3d: 10813671832
            sha3d: 53c147c7e909f3ac611db9d0a67570551b10a6ae1141df52134292cacc6d0833
            id1w: 10813522300
            sha1w: 885484db14e9c9355cf35fba150dfbbbcd783b811854b32ce80e012b07fe9b66

          - symbol: AVAXUSDT
            slug: avax
            manifest: manifests/binance-spot-avaxusdt.production-2026-09-24.json
            id15m: 10814265025
            sha15m: df24569f0d3d8ecd887e0fc3745a6f0942d78055c2617574a562e3a4baf9b17b
            id1h: 10814265030
            sha1h: 4d9b0fd87623452810d148a1a047dacd862d83fcbec2c3675e7892f3b575b459
            id4h: 10812979850
            sha4h: 89bdb9efae51718166587c7c819bce23635e31aa4db96a37d2a8a42617ced360
            id1d: 10813144664
            sha1d: 39945d0806fdf89182121f1ab9cf2cf1b05171d032887c575e094dca302ff5d4
            id3d: 10813626557
            sha3d: e520d146ee995ce42cf464495b16ebdc689f38cbfac7646771755a7d7eb149e3
            id1w: 10813776971
            sha1w: 24b7f47ad6681edb39eb33d9ba06f7c9d230680f254657bad3640f3d10d21582

    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_ROOT: /tmp/Binance
      OUT_DIR: /tmp/suite-0.2-f1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Run integration-policy unit tests
        run: |
          python -m unittest             tools.test_responsiveness_profile_reference             tools.test_operator_readiness_reference             tools.test_thesis_management_anchor_reference -v

      - name: Acquire exact canonical six-timeframe snapshot
        shell: bash
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          DEST="$DATA_ROOT/spot/$SYMBOL/consolidated"
          mkdir -p "$DEST" "$OUT_DIR"

          fetch_artifact() {
            local id="$1"
            local name="$2"
            local expected="$3"
            gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"               > "$DEST/$name"
            echo "$expected  $DEST/$name" | sha256sum -c -
          }

          fetch_artifact ${{ matrix.id15m }} "$SYMBOL"_15m.parquet ${{ matrix.sha15m }}
          fetch_artifact ${{ matrix.id1h }} "$SYMBOL"_1h.parquet ${{ matrix.sha1h }}
          fetch_artifact ${{ matrix.id4h }} "$SYMBOL"_4h.parquet ${{ matrix.sha4h }}
          fetch_artifact ${{ matrix.id1d }} "$SYMBOL"_1d.parquet ${{ matrix.sha1d }}
          fetch_artifact ${{ matrix.id3d }} "$SYMBOL"_3d.parquet ${{ matrix.sha3d }}
          fetch_artifact ${{ matrix.id1w }} "$SYMBOL"_1w.parquet ${{ matrix.sha1w }}

      - name: Run Phase F1 integrated gate
        run: |
          python -m tools.suite_0_2_phase_f1_integrated_evidence             --data-root "$DATA_ROOT"             --symbol "${{ matrix.symbol }}"             --canonical-manifest "${{ matrix.manifest }}"             --output-json "$OUT_DIR/suite-0.2-${{ matrix.slug }}-phase-f1-integrated.json"             --output-md "$OUT_DIR/suite-0.2-${{ matrix.slug }}-phase-f1-integrated.md"             --code-sha "$GITHUB_SHA"

      - name: Show summary
        run: cat "$OUT_DIR/suite-0.2-${{ matrix.slug }}-phase-f1-integrated.md"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: suite-0.2-${{ matrix.slug }}-phase-f1-integrated
          path: |
            /tmp/suite-0.2-f1/suite-0.2-${{ matrix.slug }}-phase-f1-integrated.json
            /tmp/suite-0.2-f1/suite-0.2-${{ matrix.slug }}-phase-f1-integrated.md
          retention-days: 30
