name: Static integrity

on:
  push:
    branches: ["main", "feat/**", "fix/**", "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate archive and reboot invariants
        run: python tools/check_repo_integrity.py
      - name: Test Execution semantic reference model
        run: python -m unittest tools/test_execution_state_reference.py
      - name: Test Market Map to Execution bridge
        run: python -m unittest tools/test_market_execution_bridge_reference.py
      - name: Test Momentum Turn MTE-A reference
        run: python -m unittest tools/test_momentum_turn_reference.py
      - name: Test RSI State RSE-A reference
        run: python -m unittest tools/test_rsi_state_reference.py
      - name: Test Participation PSE-A reference
        run: python -m unittest tools/test_participation_reference.py
      - name: Test integrated Execution candidate reachability
        run: python -m unittest tools/test_execution_candidate_reference.py
      - name: Validate suite semantic contract
        run: python tools/check_suite_semantics.py
      - name: Validate Execution research defaults
        run: python -m tools.check_execution_research_defaults
