name: Suite 0.2 deterministic 1M evidence

on:
  workflow_dispatch:
  push:
    branches: ["research/suite-0.2-opportunity-evidence"]
    paths:
      - ".github/workflows/suite-0.2-monthly-universe.yml"
      - "tools/monthly_aggregation_reference.py"
      - "tools/test_monthly_aggregation_reference.py"
      - "tools/suite_0_2_monthly_universe.py"
      - "tools/suite_0_2_high_horizon_universe.py"
      - "tools/suite_0_2_native_horizon_evidence.py"
      - "tools/operator_readiness_reference.py"
      - "tools/opportunity_execution_counterfactual.py"
      - "tools/opportunity_readiness_reference.py"
      - "tools/range_rotation_opportunity_reference.py"
      - "tools/range_rotation_readiness_reference.py"
      - "tools/range_rotation_reference.py"
      - "tools/opportunity_episode_reference.py"
      - "tools/opportunity_outcome_reference.py"
      - "tools/execution_candidate_reference.py"
      - "tools/execution_state_reference.py"
      - "tools/execution_integrated_evidence.py"
      - "tools/execution_historical_evidence.py"
      - "tools/market_map_offline_core.py"
      - "tools/momentum_turn_reference.py"
      - "tools/rsi_state_reference.py"
      - "tools/participation_reference.py"

permissions:
  contents: read
  actions: read

jobs:
  monthly-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_ROOT: /tmp/Binance
      DERIVED_ROOT: /tmp/Binance-derived
      OUT_DIR: /tmp/suite-0.2-monthly
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Run monthly aggregation tests
        run: python -m unittest tools.test_monthly_aggregation_reference -v

      - name: Acquire exact canonical 1D universe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$DERIVED_ROOT"

          fetch_artifact() {
            local symbol="$1"
            local id="$2"
            local expected="$3"
            local dest="$DATA_ROOT/spot/$symbol/consolidated"
            mkdir -p "$dest"
            local file="$dest/${symbol}_1d.parquet"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              > "$file"
            echo "$expected  $file" | sha256sum -c -
          }

          fetch_artifact BTCUSDT 10810907465 1788d075ad21091e279cb68ccfac79935149ca9c444a74dbc971bba00e15fdae
          fetch_artifact ETHUSDT 10813576769 6d6eca8ac9be5ea451bb848a78a0dbd33f0eb755fdab448ef8862b9e45ba3871
          fetch_artifact AVAXUSDT 10813144664 39945d0806fdf89182121f1ab9cf2cf1b05171d032887c575e094dca302ff5d4
          fetch_artifact DOGEUSDT 10814200738 b802f417a2d0a3c70a163b6debe0de40e9eb5e4b6ba5533dd6a2a9f5bcf3ad64
          fetch_artifact DOTUSDT 10813476959 fd8d0294835bffb80e42d2e7668107f0f2bcd8d83d846b7ebdce7a04775c4a30
          fetch_artifact ADAUSDT 10813911172 a5e8623789895ab105a2402f8e0a2d88f434505804c1f6744092ad6d07e05699
          fetch_artifact XRPUSDT 10813536663 4b57ad2fb2655ac608ea74e8a7e01dbc085c52edd78de19728307f8c0ec12b68
          fetch_artifact SOLUSDT 10813700747 2a9241caf72c9eace2ecc121db7b7804f02e6fe7516e1fd58f6814fcaa4ff406
          fetch_artifact UNIUSDT 10814256166 bb71b05115903263e5e4c04bf5ba07a826a51387b43e75e2fe73bff506114b0a
          fetch_artifact NEARUSDT 10812694894 d977d262a662f9639abecaa35ff6780eb1d0b482d938f221450d922ac7375c30
          fetch_artifact AAVEUSDT 10814136523 4d5da6e0de4a1e624997aa5c5ce3cde731a6ad1259123f2f3fd4fd43326343d9
          fetch_artifact HBARUSDT 10813144824 85abd444458498e4ce32948bd55884001888f4c1763e3cbfa4197c08894d9c96
          fetch_artifact LINKUSDT 10813352762 4bb73af3228f8336f091f50186f15e2a3b7ca060140aff6da58d942a9613404f
          fetch_artifact SUIUSDT 10814085043 c4fecb49738baa7855785a8b31179f6ce19a59a871a9d3625a12b2f5cf40d73e
          fetch_artifact LTCUSDT 10814280857 c1ac13b65aaaa4aad5ae9d6221f13b4a40d1e0c8e21f42b84aeef5c0256300e2

      - name: Run deterministic 1M evidence
        run: |
          python -m tools.suite_0_2_monthly_universe \
            --data-root "$DATA_ROOT" \
            --derived-root "$DERIVED_ROOT" \
            --output-json "$OUT_DIR/suite-0.2-monthly-universe.json" \
            --output-md "$OUT_DIR/suite-0.2-monthly-universe.md" \
            --code-sha "$GITHUB_SHA"

      - name: Show summary
        run: cat "$OUT_DIR/suite-0.2-monthly-universe.md"

      - name: Upload monthly evidence and derived Parquets
        uses: actions/upload-artifact@v7
        with:
          name: suite-0.2-monthly-universe
          path: |
            /tmp/suite-0.2-monthly/suite-0.2-monthly-universe.json
            /tmp/suite-0.2-monthly/suite-0.2-monthly-universe.md
            /tmp/Binance-derived/spot/*/derived/*_1M.parquet
          retention-days: 30
