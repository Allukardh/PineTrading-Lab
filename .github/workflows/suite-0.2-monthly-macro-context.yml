name: Suite 0.2 prior-month macro context

on:
  workflow_dispatch:
  push:
    branches: ["research/suite-0.2-opportunity-evidence"]
    paths:
      - ".github/workflows/suite-0.2-monthly-macro-context.yml"
      - "tools/suite_0_2_monthly_macro_context.py"
      - "tools/monthly_aggregation_reference.py"
      - "tools/market_map_offline_core.py"
      - "tools/opportunity_execution_counterfactual.py"
      - "tools/opportunity_readiness_reference.py"
      - "tools/opportunity_episode_reference.py"
      - "tools/opportunity_outcome_reference.py"
      - "tools/execution_candidate_reference.py"
      - "tools/execution_historical_evidence.py"
      - "tools/execution_integrated_evidence.py"
      - "tools/participation_reference.py"
      - "tools/rsi_state_reference.py"

permissions:
  contents: read
  actions: read

jobs:
  macro-context:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATA_ROOT: /tmp/Binance
      OUT_DIR: /tmp/suite-0.2-monthly-context
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt

      - name: Run monthly/context unit tests
        run: |
          python -m unittest \
            tools.test_monthly_aggregation_reference \
            tools.test_market_map_regime_basis -v

      - name: Acquire exact canonical 1D 3D 1W universe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          fetch_artifact() {
            local symbol="$1"
            local tf="$2"
            local id="$3"
            local expected="$4"
            local dest="$DATA_ROOT/spot/$symbol/consolidated"
            mkdir -p "$dest"
            local file="$dest/${symbol}_${tf}.parquet"
            gh api -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$file"
            echo "$expected  $file" | sha256sum -c -
          }

          fetch_artifact BTCUSDT 1d 10810907465 1788d075ad21091e279cb68ccfac79935149ca9c444a74dbc971bba00e15fdae
          fetch_artifact BTCUSDT 3d 10811056999 e4228da434e9131ae2353147181069d119bc0ef373ec4b93effc5c1dcf9a39d9
