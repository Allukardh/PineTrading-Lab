      - name: Run prior-month context study
        run: |
          python -m tools.suite_0_2_monthly_macro_context \
            --data-root "$DATA_ROOT" \
            --output-json "$OUT_DIR/suite-0.2-monthly-macro-context.json" \
            --output-md "$OUT_DIR/suite-0.2-monthly-macro-context.md" \
            --code-sha "$GITHUB_SHA"

      - name: Show summary
        run: cat "$OUT_DIR/suite-0.2-monthly-macro-context.md"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: suite-0.2-monthly-macro-context
          path: |
            /tmp/suite-0.2-monthly-context/suite-0.2-monthly-macro-context.json
            /tmp/suite-0.2-monthly-context/suite-0.2-monthly-macro-context.md
          retention-days: 30
